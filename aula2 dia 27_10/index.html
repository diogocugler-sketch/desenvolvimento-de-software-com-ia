<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino da semana</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg:'var(--bg)', card:'var(--card)', ink:'var(--ink)', soft:'var(--soft)', line:'var(--line)', accent:'var(--accent)', onaccent:'var(--onaccent)', ok:'var(--ok)', okbg:'var(--okbg)', bad:'var(--bad)' },
  fontFamily: { display:['"Barlow Condensed"','Arial Narrow','sans-serif'], body:['Barlow','system-ui','sans-serif'] }
}}};
</script>
<style>
:root{--bg:#F3F5F9;--card:#FFFFFF;--ink:#0B1B33;--soft:#44546B;--line:#9AA7BA;--accent:#1740C4;--onaccent:#FFFFFF;--ok:#0A6B36;--okbg:#DDF3E6;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#14203A;--ink:#F2F6FC;--soft:#B6C3D8;--line:#6C7F9E;--accent:#7FA2FF;--onaccent:#06122E;--ok:#6FE3A0;--okbg:#0F3A25;--bad:#FF8F86;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#14203A;--ink:#F2F6FC;--soft:#B6C3D8;--line:#6C7F9E;--accent:#7FA2FF;--onaccent:#06122E;--ok:#6FE3A0;--okbg:#0F3A25;--bad:#FF8F86;color-scheme:dark}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:18px;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// Dados de exemplo (apenas front-end). prev = carga do treino anterior, em kg.
const WEEK = [
  { id:'seg', short:'Seg', name:'Segunda', focus:'Peito e tríceps', ex:[
    { id:'a', name:'Supino reto', sets:4, reps:'8-10', prev:60 },
    { id:'b', name:'Supino inclinado com halteres', sets:3, reps:'10', prev:22 },
    { id:'c', name:'Crucifixo na máquina', sets:3, reps:'12', prev:35 },
    { id:'d', name:'Tríceps na polia', sets:4, reps:'12', prev:30 },
    { id:'e', name:'Tríceps francês', sets:3, reps:'10', prev:20 } ]},
  { id:'ter', short:'Ter', name:'Terça', focus:'Costas e bíceps', ex:[
    { id:'a', name:'Puxada na frente', sets:4, reps:'10', prev:55 },
    { id:'b', name:'Remada curvada', sets:4, reps:'8-10', prev:50 },
    { id:'c', name:'Remada baixa', sets:3, reps:'12', prev:45 },
    { id:'d', name:'Rosca direta', sets:3, reps:'10', prev:25 },
    { id:'e', name:'Rosca martelo', sets:3, reps:'12', prev:12 },
    { id:'f', name:'Face pull', sets:3, reps:'15', prev:20 } ]},
  { id:'qua', short:'Qua', name:'Quarta', focus:'Descanso', ex:[] },
  { id:'qui', short:'Qui', name:'Quinta', focus:'Pernas', ex:[
    { id:'a', name:'Agachamento livre', sets:4, reps:'8', prev:80 },
    { id:'b', name:'Leg press 45°', sets:4, reps:'10-12', prev:180 },
    { id:'c', name:'Cadeira extensora', sets:3, reps:'12', prev:50 },
    { id:'d', name:'Mesa flexora', sets:3, reps:'12', prev:40 },
    { id:'e', name:'Panturrilha em pé', sets:4, reps:'15', prev:70 } ]},
  { id:'sex', short:'Sex', name:'Sexta', focus:'Ombros e abdômen', ex:[
    { id:'a', name:'Desenvolvimento com halteres', sets:4, reps:'10', prev:20 },
    { id:'b', name:'Elevação lateral', sets:4, reps:'12', prev:10 },
    { id:'c', name:'Elevação posterior', sets:3, reps:'12', prev:8 },
    { id:'d', name:'Abdominal na polia', sets:3, reps:'15', prev:35 } ]},
  { id:'sab', short:'Sáb', name:'Sábado', focus:'Descanso', ex:[] },
  { id:'dom', short:'Dom', name:'Domingo', focus:'Descanso', ex:[] },
];

/* ---------- Calendário: dados de exemplo e utilitários ---------- */
// Dias em que o treino foi feito (exemplo). Dias de treino passados que não estão aqui contam como falta.
const FEITOS_EXEMPLO = new Set(['2026-10-01','2026-10-02','2026-10-05','2026-10-06','2026-10-08','2026-10-12','2026-10-13','2026-10-15','2026-10-16','2026-10-19','2026-10-20','2026-10-22','2026-10-23']);
const INICIO = '2026-10-01'; // antes dessa data não há registro, então não conta falta
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEM = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const pad = n => String(n).padStart(2, '0');
const isoOf = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const todayIndex = () => { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; };
const idxOf = (y, m, d) => (new Date(y, m, d).getDay() + 6) % 7; // segunda = 0
const todayIso = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth(), t.getDate()); };
const KEY = 'treino-calendario:v1';
const exKey = (d, e) => d.id + ':' + e.id;

function Check({ on }) {
  return (
    <span aria-hidden="true" className={'flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border-[3px] transition-colors ' + (on ? 'border-ok bg-ok text-bg' : 'border-ink bg-card')}>
      {on && <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>}
    </span>
  );
}

function Exercise({ ex, done, load, onToggle, onLoad }) {
  return (
    <li className={'rounded-2xl border-2 p-4 transition-colors ' + (done ? 'border-ok bg-okbg' : 'border-line bg-card')}>
      <button type="button" onClick={onToggle} role="checkbox" aria-checked={done}
        className="flex min-h-[56px] w-full items-center gap-4 text-left">
        <Check on={done} />
        <span className="flex-1">
          <span className={'block font-display text-[26px] font-bold leading-tight ' + (done ? 'line-through decoration-2' : '')}>{ex.name}</span>
          <span className="block text-[19px] font-semibold text-soft">{ex.sets} séries × {ex.reps} repetições</span>
        </span>
      </button>

      <div className="mt-3 flex flex-wrap items-end gap-3 border-t-2 border-line/50 pt-3">
        <div className="min-w-[110px]">
          <p className="text-base font-semibold text-soft">Treino anterior</p>
          <p className="font-display text-[28px] font-bold leading-none">{ex.prev} kg</p>
        </div>
        <label className="flex-1 min-w-[150px]">
          <span className="block text-base font-semibold text-soft">Carga de hoje (kg)</span>
          <input type="number" inputMode="decimal" min="0" step="0.5" value={load}
            onChange={e => onLoad(e.target.value)} placeholder={String(ex.prev)}
            className="mt-1 h-14 w-full rounded-xl border-[3px] border-ink bg-card px-3 font-display text-[28px] font-bold text-ink placeholder:text-line" />
        </label>
        <button type="button" onClick={() => onLoad(String(ex.prev))}
          className="h-14 rounded-xl border-[3px] border-accent px-4 text-lg font-bold text-accent active:bg-accent active:text-onaccent">
          Repetir {ex.prev} kg
        </button>
      </div>
    </li>
  );
}

/* ---------- Página 1: Treino do dia (código original) ---------- */
function Hoje({ done, setDone, loads, setLoads }) {
  const [dayIdx, setDayIdx] = useState(todayIndex());
  const day = WEEK[dayIdx];
  const doneCount = d => d.ex.filter(e => done[exKey(d, e)]).length;
  const total = day.ex.length, count = doneCount(day);
  const pct = total ? Math.round((count / total) * 100) : 0;
  const finished = total > 0 && count === total;

  return (
    <>
      <header>
        <h1 className="font-display text-[40px] font-bold leading-none">Treino da semana</h1>
        <p className="mt-1 text-lg text-soft">Toque no dia, marque cada exercício ao terminar.</p>
      </header>

      <nav aria-label="Dias da semana" className="tabs -mx-4 mt-5 overflow-x-auto px-4">
        <ul className="flex gap-2 pb-1">
          {WEEK.map((d, i) => {
            const sel = i === dayIdx, n = d.ex.length, c = doneCount(d);
            return (
              <li key={d.id}>
                <button type="button" onClick={() => setDayIdx(i)} aria-pressed={sel} aria-label={d.name + (n ? ', ' + c + ' de ' + n + ' feitos' : ', descanso')}
                  className={'flex h-[76px] w-[68px] flex-col items-center justify-center rounded-2xl border-[3px] transition-colors ' + (sel ? 'border-accent bg-accent text-onaccent' : 'border-line bg-card text-ink')}>
                  <span className="font-display text-[26px] font-bold leading-none">{d.short}</span>
                  <span className="mt-1 text-base font-semibold">{n ? (c === n ? 'Feito' : c + '/' + n) : 'Folga'}</span>
                </button>
              </li>
            );
          })}
        </ul>
      </nav>

      <section className="mt-6" aria-live="polite">
        <h2 className="font-display text-[34px] font-bold leading-tight">{day.name}: {day.focus}</h2>

        {total > 0 ? (
          <>
            <div className="mt-3" role="progressbar" aria-valuemin="0" aria-valuemax={total} aria-valuenow={count} aria-label="Progresso do treino">
              <div className="flex justify-between text-lg font-semibold">
                <span>{count} de {total} exercícios</span><span>{pct}%</span>
              </div>
              <div className="mt-1 h-4 overflow-hidden rounded-full border-2 border-ink bg-card">
                <div className="h-full bg-ok transition-all" style={{ width: pct + '%' }} />
              </div>
            </div>

            {finished && (
              <p className="mt-4 rounded-2xl bg-ok p-4 text-xl font-bold text-bg">Treino concluído. Bom trabalho! Já aparece como presença no calendário.</p>
            )}

            <ul className="mt-5 space-y-4">
              {day.ex.map(e => {
                const k = exKey(day, e);
                return <Exercise key={k} ex={e} done={!!done[k]} load={loads[k] || ''}
                  onToggle={() => setDone(s => ({ ...s, [k]: !s[k] }))}
                  onLoad={v => setLoads(s => ({ ...s, [k]: v }))} />;
              })}
            </ul>

            <div className="fixed inset-x-0 z-10 px-4" style={{ bottom: 'calc(env(safe-area-inset-bottom, 0px) + 76px)' }}>
              <button type="button" disabled={finished}
                onClick={() => { const next = {}; day.ex.forEach(e => { next[exKey(day, e)] = true; }); setDone(s => ({ ...s, ...next })); }}
                className="mx-auto block h-16 w-full max-w-2xl rounded-2xl bg-accent text-[22px] font-bold text-onaccent shadow-lg disabled:opacity-60">
                {finished ? 'Todos os exercícios feitos' : 'Concluir todos os exercícios'}
              </button>
            </div>
          </>
        ) : (
          <p className="mt-4 rounded-2xl border-2 border-line bg-card p-5 text-xl">Hoje é dia de descanso. Escolha outro dia acima para ver o treino.</p>
        )}
      </section>
    </>
  );
}

/* ---------- Página 2: Calendário de presença ---------- */
const ESTILO = {
  fui:       'border-ok bg-ok text-bg',
  faltei:    'border-bad bg-bad text-bg',
  descanso:  'border-transparent bg-transparent text-soft',
  pendente:  'border-line bg-card text-ink',
  nada:      'border-transparent bg-transparent text-soft'
};
const MARCA = { fui: '✓', faltei: '✕', descanso: '', pendente: '', nada: '' };
const TEXTO = { fui: 'Você foi treinar', faltei: 'Você não foi treinar', descanso: 'Dia de descanso', pendente: 'Treino ainda não feito', nada: 'Sem registro' };

function Calendario({ statusOf, presenca, setPresenca }) {
  const hoje = todayIso();
  const t = new Date();
  const [ym, setYm] = useState({ y: t.getFullYear(), m: t.getMonth() });
  const [sel, setSel] = useState(hoje);
  const dias = new Date(ym.y, ym.m + 1, 0).getDate();
  const vazios = idxOf(ym.y, ym.m, 1);
  const mover = n => setYm(({ y, m }) => { const d = new Date(y, m + n, 1); return { y: d.getFullYear(), m: d.getMonth() }; });

  let fui = 0, faltei = 0;
  for (let d = 1; d <= dias; d++) { const s = statusOf(isoOf(ym.y, ym.m, d)); if (s === 'fui') fui++; if (s === 'faltei') faltei++; }
  const taxa = fui + faltei ? Math.round(fui / (fui + faltei) * 100) : 0;

  const [sy, sm, sd] = sel.split('-').map(Number);
  const selStatus = statusOf(sel), selDia = WEEK[idxOf(sy, sm - 1, sd)];
  const manual = presenca[sel] !== undefined;
  const marcar = v => setPresenca(p => ({ ...p, [sel]: v }));
  const limpar = () => setPresenca(p => { const n = { ...p }; delete n[sel]; return n; });

  return (
    <>
      <h1 className="font-display text-[40px] font-bold leading-none">Calendário</h1>
      <p className="mt-1 text-lg text-soft">Veja os dias em que você foi treinar e os dias em que faltou.</p>

      <div className="mt-4 flex items-center justify-between gap-2">
        <button type="button" onClick={() => mover(-1)} aria-label="Mês anterior" className="h-14 w-14 rounded-xl border-[3px] border-ink bg-card text-2xl font-bold">‹</button>
        <h2 className="font-display text-[30px] font-bold leading-none" aria-live="polite">{MESES[ym.m]} {ym.y}</h2>
        <button type="button" onClick={() => mover(1)} aria-label="Próximo mês" className="h-14 w-14 rounded-xl border-[3px] border-ink bg-card text-2xl font-bold">›</button>
      </div>

      <div className="mt-4 grid grid-cols-7 gap-1.5 text-center">
        {SEM.map(s => <span key={s} className="text-sm font-bold text-soft">{s}</span>)}
        {Array.from({ length: vazios }).map((_, i) => <span key={'v' + i} />)}
        {Array.from({ length: dias }).map((_, i) => {
          const d = i + 1, iso = isoOf(ym.y, ym.m, d), s = statusOf(iso);
          return (
            <button key={iso} type="button" onClick={() => setSel(iso)} aria-pressed={iso === sel}
              aria-label={d + ' de ' + MESES[ym.m] + ': ' + TEXTO[s] + (iso === hoje ? ' (hoje)' : '')}
              className={'flex h-14 flex-col items-center justify-center rounded-xl border-[3px] ' + ESTILO[s] + (iso === hoje ? ' !border-accent' : '') + (iso === sel ? ' ring-[3px] ring-ink ring-offset-2 ring-offset-bg' : '')}>
              <span className="text-lg font-bold leading-none">{d}</span>
              <span className="mt-0.5 text-sm font-bold leading-none" aria-hidden="true">{MARCA[s] || '\u00a0'}</span>
            </button>
          );
        })}
      </div>

      <ul className="mt-4 flex flex-wrap gap-x-5 gap-y-1 text-base font-semibold" aria-label="Legenda">
        <li><span className="mr-1 inline-block h-4 w-4 rounded bg-ok align-middle" aria-hidden="true" />✓ Fui</li>
        <li><span className="mr-1 inline-block h-4 w-4 rounded bg-bad align-middle" aria-hidden="true" />✕ Não fui</li>
        <li><span className="mr-1 inline-block h-4 w-4 rounded border-[3px] border-accent align-middle" aria-hidden="true" />Hoje</li>
      </ul>

      <div className="mt-4 grid grid-cols-3 gap-3 text-center">
        <div className="rounded-2xl border-2 border-line bg-card p-3"><p className="font-display text-[34px] font-bold leading-none text-ok">{fui}</p><p className="text-base font-semibold text-soft">treinos feitos</p></div>
        <div className="rounded-2xl border-2 border-line bg-card p-3"><p className="font-display text-[34px] font-bold leading-none text-bad">{faltei}</p><p className="text-base font-semibold text-soft">faltas</p></div>
        <div className="rounded-2xl border-2 border-line bg-card p-3"><p className="font-display text-[34px] font-bold leading-none">{taxa}%</p><p className="text-base font-semibold text-soft">presença</p></div>
      </div>

      <section className="mt-4 rounded-2xl border-2 border-line bg-card p-4" aria-live="polite">
        <p className="text-base font-semibold text-soft">{selDia.name}, {pad(sd)}/{pad(sm)}{sel === hoje ? ' · hoje' : ''}</p>
        <h3 className="font-display text-[28px] font-bold leading-tight">{selDia.focus}</h3>
        <p className={'text-lg font-bold ' + (selStatus === 'fui' ? 'text-ok' : selStatus === 'faltei' ? 'text-bad' : 'text-soft')}>{MARCA[selStatus]} {TEXTO[selStatus]}</p>
        <div className="mt-3 grid grid-cols-2 gap-3">
          <button type="button" onClick={() => marcar(true)} className="h-14 rounded-xl border-[3px] border-ok bg-ok text-lg font-bold text-bg">Fui treinar</button>
          <button type="button" onClick={() => marcar(false)} className="h-14 rounded-xl border-[3px] border-bad bg-bad text-lg font-bold text-bg">Não fui</button>
        </div>
        {manual && <button type="button" onClick={limpar} className="mt-3 h-12 w-full rounded-xl border-[3px] border-line text-base font-bold text-soft">Remover meu registro deste dia</button>}
      </section>
    </>
  );
}

/* ---------- App: navegação entre as páginas ---------- */
const ic = p => <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{p}</svg>;
const TABS = [
  ['hoje', 'Treino', ic(<><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></>)],
  ['calendario', 'Calendário', ic(<><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></>)]
];

function App() {
  const saved = useMemo(() => {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return { done: s.done || {}, loads: s.loads || {}, presenca: s.presenca || {} }; } catch (e) {}
    return { done: {}, loads: {}, presenca: {} };
  }, []);
  const [view, setView] = useState('hoje');
  const [done, setDone] = useState(saved.done);
  const [loads, setLoads] = useState(saved.loads);
  const [presenca, setPresenca] = useState(saved.presenca);
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify({ done, loads, presenca })); } catch (e) {} }, [done, loads, presenca]);

  const hoje = todayIso();
  const t = new Date(); t.setDate(t.getDate() - todayIndex());
  const semanaAtual = Array.from({ length: 7 }, (_, i) => isoOf(t.getFullYear(), t.getMonth(), t.getDate() + i));

  // Resultado de cada data: fui, faltei, descanso, pendente ou nada
  const statusOf = iso => {
    if (presenca[iso] !== undefined) return presenca[iso] ? 'fui' : 'faltei';
    const [y, m, d] = iso.split('-').map(Number), wd = idxOf(y, m - 1, d), dia = WEEK[wd], wi = semanaAtual.indexOf(iso);
    if (wi >= 0 && dia.ex.length && dia.ex.every(e => done[exKey(dia, e)])) return 'fui';
    if (FEITOS_EXEMPLO.has(iso)) return 'fui';
    if (!dia.ex.length) return 'descanso';
    if (iso < INICIO) return 'nada';
    return iso < hoje ? 'faltei' : 'pendente';
  };

  return (
    <>
      <main className="mx-auto max-w-2xl px-4 pb-52 pt-5">
        {view === 'hoje'
          ? <Hoje done={done} setDone={setDone} loads={loads} setLoads={setLoads} />
          : <Calendario statusOf={statusOf} presenca={presenca} setPresenca={setPresenca} />}
      </main>
      <nav aria-label="Principal" className="fixed inset-x-0 bottom-0 z-20 border-t-2 border-line bg-card" style={{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
        <ul className="mx-auto flex max-w-2xl">
          {TABS.map(tb => (
            <li key={tb[0]} className="flex-1">
              <button type="button" onClick={() => { setView(tb[0]); window.scrollTo(0, 0); }} aria-current={view === tb[0] ? 'page' : undefined}
                className={'flex h-16 w-full flex-col items-center justify-center gap-0.5 text-base font-bold ' + (view === tb[0] ? 'text-accent' : 'text-soft')}>
                {tb[2]}<span>{tb[1]}</span>
              </button>
            </li>
          ))}
        </ul>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
