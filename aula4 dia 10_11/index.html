<style>
/* ---------- Paleta (preto) ---------- */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#000000; --card:#0F0F12; --ink:#F5F5F7; --soft:#A3A3AD; --line:#2B2B31;
  --accent:#8F94FF; --accent2:#5F8CFF; --onaccent:#050514;
  --ok:#4ADE80; --ok2:#22B866; --okbg:#0A2416; --bad:#FF6B73;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 32px -18px rgba(0,0,0,.9);
  --glow:0 10px 24px -10px color-mix(in srgb,var(--accent) 65%,transparent);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)
}

/* ---------- Base ---------- */
html,body{height:auto}
body{
  font-family:Figtree,system-ui,sans-serif;font-size:18px;margin:0;color:var(--ink);
  background:
    radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),
    radial-gradient(700px 380px at -10% 18%,color-mix(in srgb,var(--accent2) 6%,transparent),transparent 70%),
    var(--bg);

/* ---------- Cartões ---------- */

/* ---------- Botões ---------- */
body button{transition:transform .12s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
body button:not(:disabled):active{transform:scale(.97)}

body .bg-accent:disabled{box-shadow:none}
body button.rounded-xl,body button.rounded-2xl{border-radius:16px}
@media (hover:hover){
  body button:not(:disabled):hover{box-shadow:0 8px 18px -10px color-mix(in srgb,var(--ink) 40%,transparent)}
  body .bg-accent:not(:disabled):hover{box-shadow:var(--glow);filter:brightness(1.06)}
}

/* ---------- Campos ---------- */
body input,body select{border-radius:14px;transition:border-color .15s,box-shadow .15s}
body input:focus,body select:focus{

  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
body input[type=number]{font-variant-numeric:tabular-nums}

/* ---------- Dias da semana ---------- */
body nav[aria-label="Dias da semana"] button{border-width:2px;border-radius:20px;box-shadow:var(--shadow)}
body nav[aria-label="Dias da semana"] button[aria-pressed="true"]{border-color:transparent;transform:translateY(-3px)}

/* ---------- Check dos exercícios ---------- */
body .h-12.w-12.shrink-0{border-radius:9999px}
body .h-12.w-12.shrink-0.bg-ok{background-image:linear-gradient(135deg,var(--ok2),var(--ok));animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- Progresso ---------- */
body [role=progressbar] .h-4{height:14px;border-width:0;background:color-mix(in srgb,var(--ink) 14%,transparent)}
body [role=progressbar] .bg-ok{background-image:linear-gradient(90deg,var(--ok),var(--ok2));border-radius:9999px}
body p.bg-ok{
  background-image:linear-gradient(135deg,var(--ok),var(--ok2));border-radius:22px;
  box-shadow:0 14px 28px -14px color-mix(in srgb,var(--ok) 80%,transparent)}

/* ---------- Calendário ---------- */
body .grid-cols-7 button{border-radius:16px;border-width:2px;box-shadow:none}
body .grid-cols-7 button.bg-ok{background-image:linear-gradient(135deg,var(--ok2),var(--ok))}
body .grid-cols-7 button.bg-bad{background-image:linear-gradient(135deg,var(--bad),color-mix(in srgb,var(--bad) 75%,#000))}

body .grid-cols-3 .font-display{font-size:40px}

/* ---------- Gráficos ---------- */

/* ---------- Barra inferior (vidro) ---------- */
body nav[aria-label="Principal"]{
  background:color-mix(in srgb,#000 82%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);

  box-shadow:0 -12px 30px -18px rgba(0,0,0,.9)}
body nav[aria-label="Principal"] button{position:relative;box-shadow:none}
body nav[aria-label="Principal"] button[aria-current="page"]::before{

  border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
body nav[aria-label="Principal"] button[aria-current="page"] svg{filter:drop-shadow(0 3px 5px color-mix(in srgb,var(--accent) 45%,transparent))}

/* ---------- Login ---------- */

/* ---------- Erros ---------- */

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

async function api(action, options = {}) {
  const response = await fetch('api.php?action=' + encodeURIComponent(action), {
    credentials: 'same-origin',
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(result.error || 'Não foi possível concluir a operação.');
    error.status = response.status;
    throw error;
  }
  return result;
}

// Dados de exemplo (apenas front-end). prev = carga do treino anterior, em kg.
const WEEK = [
  { id:'seg', short:'Seg', name:'Segunda', focus:'Peito e tríceps', ex:[
    { id:'a', name:'Supino reto', sets:4, reps:'8-10', prev:60 },
    { id:'b', name:'Supino inclinado com halteres', sets:3, reps:'10', prev:22 },
    { id:'c', name:'Crucifixo na máquina', sets:3, reps:'12', prev:35 },
    { id:'d', name:'Tríceps na polia', sets:4, reps:'12', prev:30 },
    { id:'e', name:'Tríceps francês', sets:3, reps:'10', prev:20 } ]},
  { id:'ter', short:'Ter', name:'Terça', focus:'Costas e bíceps', ex:[
    { id:'a', name:'Puxada na frente', sets:4, reps:'10', prev:55 },
    { id:'b', name:'Remada curvada', sets:4, reps:'8-10', prev:50 },
    { id:'c', name:'Remada baixa', sets:3, reps:'12', prev:45 },
    { id:'d', name:'Rosca direta', sets:3, reps:'10', prev:25 },
    { id:'e', name:'Rosca martelo', sets:3, reps:'12', prev:12 },
    { id:'f', name:'Face pull', sets:3, reps:'15', prev:20 } ]},
  { id:'qua', short:'Qua', name:'Quarta', focus:'Descanso', ex:[] },
  { id:'qui', short:'Qui', name:'Quinta', focus:'Pernas', ex:[
    { id:'a', name:'Agachamento livre', sets:4, reps:'8', prev:80 },
    { id:'b', name:'Leg press 45°', sets:4, reps:'10-12', prev:180 },
    { id:'c', name:'Cadeira extensora', sets:3, reps:'12', prev:50 },
    { id:'d', name:'Mesa flexora', sets:3, reps:'12', prev:40 },
    { id:'e', name:'Panturrilha em pé', sets:4, reps:'15', prev:70 } ]},
  { id:'sex', short:'Sex', name:'Sexta', focus:'Ombros e abdômen', ex:[
    { id:'a', name:'Desenvolvimento com halteres', sets:4, reps:'10', prev:20 },
    { id:'b', name:'Elevação lateral', sets:4, reps:'12', prev:10 },
    { id:'c', name:'Elevação posterior', sets:3, reps:'12', prev:8 },
    { id:'d', name:'Abdominal na polia', sets:3, reps:'15', prev:35 } ]},
  { id:'sab', short:'Sáb', name:'Sábado', focus:'Descanso', ex:[] },
  { id:'dom', short:'Dom', name:'Domingo', focus:'Descanso', ex:[] },
];

/* ---------- Calendário: utilitários ---------- */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEM = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const pad = n => String(n).padStart(2, '0');
const isoOf = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const formatDuration = seconds => {
  const hours = Math.floor(seconds / 3600), minutes = Math.floor((seconds % 3600) / 60), remaining = seconds % 60;
  return hours ? pad(hours) + ':' + pad(minutes) + ':' + pad(remaining) : pad(minutes) + ':' + pad(remaining);
};
const formatDateTime = timestamp => new Date(timestamp).toLocaleString('pt-BR', {
  dateStyle: 'short',
  timeStyle: 'short'
});
const repCountForEstimate = reps => {
  const match = String(reps).trim().match(/^(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?$/);
  return match ? Number(match[2] || match[1]) : null;
};
const estimateOneRepMax = (load, reps) => {
  const weight = Number(load), count = repCountForEstimate(reps);
  return Number.isFinite(weight) && weight > 0 && count > 0
    ? weight * (1 + count / 30)
    : null;
};
const todayIndex = () => { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; };
const idxOf = (y, m, d) => (new Date(y, m, d).getDay() + 6) % 7; // segunda = 0
const todayIso = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth(), t.getDate()); };
const exKey = (d, e) => d.id + ':' + e.id;

function Check({ on }) {
  return (
    <span aria-hidden="true" className={'flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border-[3px] transition-colors ' + (on ? 'border-ok bg-ok text-bg' : 'border-ink bg-card')}>
      {on && <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>}
    </span>
  );
}

function Exercise({ ex, done, load, onToggle, onLoad }) {
  const [loadError, setLoadError] = useState('');
  const hasPreviousLoad = Number.isFinite(ex.prev);
  const repsForEstimate = repCountForEstimate(ex.reps);
  const estimatedMax = estimateOneRepMax(load, ex.reps);
  const changeLoad = value => {
    if (value === '' || (Number.isFinite(Number(value)) && Number(value) >= 0)) {
      setLoadError('');
      onLoad(value);
      return;
    }

    setLoadError('A carga deve ser um número igual ou maior que zero.');
  };
  return (
    <li className={'rounded-2xl border-2 p-4 transition-colors ' + (done ? 'border-ok bg-okbg' : 'border-line bg-card')}>
      <button type="button" onClick={onToggle} role="checkbox" aria-checked={done}
        className="flex min-h-[56px] w-full items-center gap-4 text-left">
        <Check on={done} />
        <span className="flex-1">
          <span className={'block font-display text-[26px] font-bold leading-tight ' + (done ? 'line-through decoration-2' : '')}>{ex.name}</span>
          <span className="block text-[19px] font-semibold text-soft">{ex.sets} séries × {ex.reps} repetições</span>
        </span>
      </button>

      <div className="mt-3 flex flex-wrap items-end gap-3 border-t-2 border-line/50 pt-3">
        <div className="min-w-[110px]">
          <p className="text-base font-semibold text-soft">Treino anterior</p>
          <p className="font-display text-[28px] font-bold leading-none">{hasPreviousLoad ? ex.prev + ' kg' : 'Sem registro'}</p>
        </div>
        <label className="flex-1 min-w-[150px]">
          <span className="block text-base font-semibold text-soft">Carga de hoje (kg)</span>
          <input type="number" inputMode="decimal" min="0" step="0.5" value={load}
            aria-invalid={!!loadError} aria-describedby={loadError ? 'load-error-' + ex.id : undefined}
            onChange={e => changeLoad(e.target.value)} placeholder={hasPreviousLoad ? String(ex.prev) : 'Carga'}
            className="mt-1 h-14 w-full rounded-xl border-[3px] border-ink bg-card px-3 font-display text-[28px] font-bold text-ink placeholder:text-line" />
          {loadError && <span id={'load-error-' + ex.id} role="alert" className="mt-1 block text-sm font-semibold text-bad">{loadError}</span>}
        </label>
        {hasPreviousLoad && (
          <button type="button" onClick={() => onLoad(String(ex.prev))}
            className="h-14 rounded-xl border-[3px] border-accent px-4 text-lg font-bold text-accent active:bg-accent active:text-onaccent">
            Repetir {ex.prev} kg
          </button>
        )}
      </div>
      {estimatedMax !== null && (
        <p className="mt-2 text-base font-semibold text-soft">
          1RM estimado: {estimatedMax.toFixed(1)} kg
          {String(ex.reps).includes('-') && repsForEstimate !== null
            ? ' (usando ' + repsForEstimate + ' repetições)'
            : ''}
        </p>
      )}
    </li>
  );
}

function ProgressionChart({ exercises, historico, dayIds, title }) {
  const [selectedName, setSelectedName] = useState(exercises[0]?.name || '');
  const selectedExercise = exercises.find(exercise => exercise.name === selectedName) || exercises[0];
  const points = selectedExercise ? historico
    .filter(session => !dayIds || dayIds.includes(session.diaId))
    .map(session => {
      const recordedExercise = session.exercicios.find(exercise => exercise.nome === selectedExercise.name);
      const estimate = recordedExercise?.feito
        ? estimateOneRepMax(recordedExercise.carga, recordedExercise.repeticoes)
        : null;
      return estimate === null ? null : { timestamp: session.iniciadoEm, estimate };
    })
    .filter(Boolean)
    .sort((a, b) => a.timestamp - b.timestamp)
    .slice(-12) : [];

  if (!selectedExercise) return null;

  const width = 640, height = 220, paddingX = 44, paddingY = 28;
  const values = points.map(point => point.estimate);
  const minValue = values.length ? Math.min(...values) : 0;
  const maxValue = values.length ? Math.max(...values) : 0;
  const range = maxValue - minValue || Math.max(maxValue * 0.1, 1);
  const chartPoints = points.map((point, index) => ({
    ...point,
    x: points.length === 1
      ? width / 2
      : paddingX + (index * (width - paddingX * 2)) / (points.length - 1),
    y: height - paddingY - ((point.estimate - minValue) / range) * (height - paddingY * 2)
  }));
  const line = chartPoints.map(point => point.x + ',' + point.y).join(' ');

  return (
    <section className="mt-6 rounded-2xl border-2 border-line bg-card p-4">
      <h3 className="font-display text-[28px] font-bold">{title || 'Progressão e 1RM estimado'}</h3>
      <label className="mt-2 block">
        <span className="block text-base font-semibold text-soft">Exercício</span>
        <select value={selectedExercise.name} onChange={event => setSelectedName(event.target.value)}
          className="mt-1 h-12 w-full rounded-xl border-2 border-line bg-card px-3 text-base">
          {exercises.map(exercise => (
            <option key={exercise.name} value={exercise.name}>{exercise.name}</option>
          ))}
        </select>
      </label>
      {points.length ? (
        <>
          <div className="mt-3 overflow-hidden" role="img"
            aria-label={'Gráfico de progressão do 1RM estimado para ' + selectedExercise.name}>
            <svg viewBox={'0 0 ' + width + ' ' + height} className="w-full" aria-hidden="true">
              <line x1={paddingX} y1={paddingY} x2={paddingX} y2={height - paddingY} stroke="currentColor" opacity="0.35" />
              <line x1={paddingX} y1={height - paddingY} x2={width - paddingX} y2={height - paddingY} stroke="currentColor" opacity="0.35" />
              {chartPoints.length > 1 && (
                <polyline points={line} fill="none" stroke="var(--accent)" strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" />
              )}
              {chartPoints.map((point, index) => (
                <g key={point.timestamp + '-' + index}>
                  <circle cx={point.x} cy={point.y} r="7" fill="var(--accent)" />
                  <text x={point.x} y={Math.max(18, point.y - 12)} textAnchor="middle" fill="currentColor" fontSize="16" fontWeight="700">
                    {point.estimate.toFixed(1)}
                  </text>
                </g>
              ))}
            </svg>
          </div>
          <p className="text-center text-sm text-soft">1RM estimado (kg) · sessões em ordem cronológica</p>
          <ul className="mt-3 space-y-1 text-sm text-soft">
            {chartPoints.map((point, index) => (
              <li key={point.timestamp + '-label-' + index}>
                {formatDateTime(point.timestamp)} · {point.estimate.toFixed(1)} kg
              </li>
            ))}
          </ul>
        </>
      ) : (
        <p className="mt-3 text-soft">Registre a carga do exercício e finalize o treino para começar a ver a progressão.</p>
      )}
    </section>
  );
}

function Leaderboard({ title, description, entries, valueLabel, formatValue, userId }) {
  return (
    <section className="mt-4 rounded-2xl border-2 border-line bg-card p-4">
      <h3 className="font-display text-[26px] font-bold">{title}</h3>
      <p className="text-sm text-soft">{description}</p>
      {entries.length ? (
        <ol className="mt-3 space-y-2">
          {entries.map((entry, index) => (
            <li key={entry.id} className={'flex items-center justify-between gap-3 rounded-xl border-2 p-3 ' + (entry.id === userId ? 'border-accent bg-accent/5' : 'border-line')}>
              <span className="min-w-0">
                <span className="font-bold">{index + 1}. {entry.nome}{entry.id === userId ? ' (você)' : ''}</span>
                {entry.exercicio && <span className="block truncate text-sm text-soft">{entry.exercicio}</span>}
              </span>
              <span className="shrink-0 text-right font-bold">{formatValue(entry.valor)}<span className="block text-xs font-normal text-soft">{valueLabel}</span></span>
            </li>
          ))}
        </ol>
      ) : (
        <p className="mt-3 text-soft">Ainda não há dados para este ranking.</p>
      )}
    </section>
  );
}

const MUSCLE_GROUPS = [
  { id: 'peito-triceps', title: 'Peito e tríceps', dayIds: ['seg'] },
  { id: 'costas-biceps', title: 'Costas e bíceps', dayIds: ['ter'] },
  { id: 'pernas', title: 'Pernas', dayIds: ['qui'] },
  { id: 'ombros-abdomen', title: 'Ombros e abdômen', dayIds: ['sex'] },
  { id: 'personalizado', title: 'Treinos personalizados', dayIds: ['qua', 'sab', 'dom'] }
];

function Perfil({ user, workoutPlan, historico, rankings, rankingBusy, rankingError }) {
  const [section, setSection] = useState('evolucao');
  const chartGroups = MUSCLE_GROUPS.map(group => {
    const exerciseMap = new Map(
      group.dayIds.flatMap(dayId => workoutPlan[dayId] || []).map(exercise => [exercise.name, exercise])
    );
    historico
      .filter(session => group.dayIds.includes(session.diaId))
      .forEach(session => session.exercicios.forEach(exercise => {
        if (!exerciseMap.has(exercise.nome)) {
          exerciseMap.set(exercise.nome, {
            id: 'history-' + exercise.nome,
            name: exercise.nome,
            reps: exercise.repeticoes
          });
        }
      }));
    return { ...group, exercises: Array.from(exerciseMap.values()) };
  }).filter(group => group.exercises.length > 0);
  const formatCount = value => String(value);
  const formatKg = value => Number(value).toFixed(1) + ' kg';
  const formatVolume = value => Number(value).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' kg';

  return (
    <>
      <header>
        <h1 className="font-display text-[40px] font-bold leading-none">Perfil</h1>
        <p className="mt-1 text-lg text-soft">{user.nome} · acompanhe sua evolução ou consulte os rankings.</p>
      </header>

      <nav aria-label="Seções do perfil" className="mt-5 grid grid-cols-2 gap-2">
        <button type="button" role="tab" aria-selected={section === 'evolucao'}
          onClick={() => setSection('evolucao')}
          className={'h-12 rounded-xl border-2 px-2 text-base font-bold ' + (section === 'evolucao' ? 'border-accent bg-accent text-onaccent' : 'border-line bg-card')}>
          Gráficos musculares
        </button>
        <button type="button" role="tab" aria-selected={section === 'rankings'}
          onClick={() => setSection('rankings')}
          className={'h-12 rounded-xl border-2 px-2 text-base font-bold ' + (section === 'rankings' ? 'border-accent bg-accent text-onaccent' : 'border-line bg-card')}>
          Rankings
        </button>
      </nav>

      {section === 'evolucao' ? (
        <section aria-label="Evolução muscular">
          <h2 className="mt-5 font-display text-[32px] font-bold">Evolução por grupo muscular</h2>
          <p className="text-base text-soft">Cada gráfico mostra o 1RM estimado dos exercícios concluídos naquele grupo, ao longo dos treinos.</p>
          {chartGroups.map(group => (
            <ProgressionChart key={group.id} title={group.title} exercises={group.exercises}
              historico={historico} dayIds={group.dayIds} />
          ))}
        </section>
      ) : (
        <section aria-label="Rankings" className="mt-5">
          <h2 className="font-display text-[32px] font-bold">Rankings</h2>
          <p className="text-base text-soft">Os rankings mostram nomes e resultados, nunca e-mails.</p>
          {rankingBusy && <p role="status" className="mt-3 text-soft">Carregando rankings…</p>}
          {rankingError && <p role="alert" className="mt-3 rounded-xl bg-red-100 p-3 font-semibold text-red-800">{rankingError}</p>}
          {!rankingBusy && !rankingError && rankings && (
            <>
              <Leaderboard title="Treinos finalizados" description="Total de sessões concluídas no histórico."
                entries={rankings.treinos || []} valueLabel="treinos" formatValue={formatCount} userId={user.id} />
              <Leaderboard title="Maior 1RM estimado" description="Maior estimativa registrada em qualquer exercício; os resultados dependem do exercício."
                entries={rankings.oneRm || []} valueLabel="1RM" formatValue={formatKg} userId={user.id} />
              <Leaderboard title="Maior volume levantado" description="Séries concluídas × repetições × carga somadas no histórico."
                entries={rankings.volume || []} valueLabel="volume" formatValue={formatVolume} userId={user.id} />
            </>
          )}
        </section>
      )}
    </>
  );
}

function WorkoutEditor({ day, workoutPlan, setWorkoutPlan, locked }) {
  const [name, setName] = useState('');
  const [sets, setSets] = useState('3');
  const [reps, setReps] = useState('10');
  const exercises = workoutPlan[day.id] || [];
  const canAddExercise = exercises.length < 30;

  const moveExercise = (exercise, destinationId) => {
    if (destinationId === day.id) return;
    setWorkoutPlan(plan => {
      const destination = plan[destinationId];
      if (destination.length >= 30) return plan;
      const movedExercise = destination.some(item => item.id === exercise.id)
        ? { ...exercise, id: 'moved-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) }
        : exercise;
      return {
        ...plan,
        [day.id]: plan[day.id].filter(item => item.id !== exercise.id),
        [destinationId]: [...destination, movedExercise]
      };
    });
  };

  const addExercise = event => {
    event.preventDefault();
    const exerciseName = name.trim();
    if (!exerciseName || !canAddExercise || locked) return;
    setWorkoutPlan(plan => ({
      ...plan,
      [day.id]: [...plan[day.id], {
        id: 'custom-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
        name: exerciseName,
        sets: Number(sets),
        reps: reps.trim(),
        prev: null
      }]
    }));
    setName('');
  };

  return (
    <section className="mt-6 rounded-2xl border-2 border-line bg-card p-4">
      <h3 className="font-display text-[28px] font-bold">Editar treino de {day.name}</h3>
      <p className="text-base text-soft">Adicione exercícios ou mova-os entre os dias da semana.</p>
      {locked && <p className="mt-2 text-sm font-semibold text-soft">Finalize o treino em andamento para editar a rotina.</p>}
      {!canAddExercise && <p className="mt-2 text-sm font-semibold text-soft">Este dia já atingiu o limite de 30 exercícios.</p>}

      {exercises.length ? (
        <ul className="mt-3 space-y-3">
          {exercises.map(exercise => (
            <li key={exercise.id} className="rounded-xl border-2 border-line p-3">
              <p className="font-bold">{exercise.name}</p>
              <p className="text-sm text-soft">{exercise.sets} séries × {exercise.reps} repetições</p>
              <div className="mt-2 flex flex-wrap items-end gap-2">
                <label className="min-w-[150px] flex-1">
                  <span className="block text-sm font-semibold text-soft">Mover para</span>
                  <select aria-label={'Mover ' + exercise.name + ' para'} defaultValue=""
                    disabled={locked}
                    onChange={event => {
                      const destination = event.target.value;
                      if (destination && (workoutPlan[destination] || []).length < 30) {
                        moveExercise(exercise, destination);
                      }
                    }}
                    className="mt-1 h-12 w-full rounded-xl border-2 border-line bg-card px-2 text-base">
                    <option value="" disabled>Escolha um dia</option>
                    {WEEK.filter(item => item.id !== day.id).map(item => (
                      <option key={item.id} value={item.id} disabled={(workoutPlan[item.id] || []).length >= 30}>
                        {item.name}{(workoutPlan[item.id] || []).length >= 30 ? ' (limite atingido)' : ''}
                      </option>
                    ))}
                  </select>
                </label>
                <button type="button" disabled={locked}
                  onClick={() => setWorkoutPlan(plan => ({
                    ...plan,
                    [day.id]: plan[day.id].filter(item => item.id !== exercise.id)
                  }))}
                  className="h-12 rounded-xl border-2 border-bad px-3 font-bold text-bad disabled:opacity-50">
                  Remover
                </button>
              </div>
            </li>
          ))}
        </ul>
      ) : (
        <p className="mt-3 text-soft">Nenhum exercício neste dia. Adicione um abaixo.</p>
      )}

      <form onSubmit={addExercise} className="mt-4 space-y-3 border-t-2 border-line/50 pt-4">
        <label className="block">
          <span className="block font-semibold">Nome do exercício</span>
          <input value={name} onChange={event => setName(event.target.value)} required maxLength="120"
            placeholder="Ex.: Agachamento livre" disabled={locked}
            className="mt-1 h-12 w-full rounded-xl border-2 border-line bg-card px-3 text-base disabled:opacity-50" />
        </label>
        <div className="grid grid-cols-2 gap-3">
          <label>
            <span className="block font-semibold">Séries</span>
            <input type="number" min="1" max="100" step="1" value={sets}
              onChange={event => setSets(event.target.value)} required disabled={locked}
              className="mt-1 h-12 w-full rounded-xl border-2 border-line bg-card px-3 text-base disabled:opacity-50" />
          </label>
          <label>
            <span className="block font-semibold">Repetições</span>
            <input value={reps} onChange={event => setReps(event.target.value)} required maxLength="30"
              disabled={locked}
              className="mt-1 h-12 w-full rounded-xl border-2 border-line bg-card px-3 text-base disabled:opacity-50" />
          </label>
        </div>
        <button type="submit" disabled={locked || !canAddExercise}
          className="h-12 w-full rounded-xl bg-accent font-bold text-onaccent disabled:opacity-50">
          Adicionar em {day.name}
        </button>
      </form>
    </section>
  );
}

/* ---------- Página 1: Treino do dia (código original) ---------- */
function Hoje({ done, setDone, loads, setLoads, historico, setHistorico, sessaoAtiva, setSessaoAtiva, workoutPlan, setWorkoutPlan }) {
  const [dayIdx, setDayIdx] = useState(todayIndex());
  const [now, setNow] = useState(Date.now());
  const day = { ...WEEK[dayIdx], ex: workoutPlan[WEEK[dayIdx].id] || [] };
  const activeForDay = sessaoAtiva?.diaId === day.id;
  const sessionCompleted = new Set(activeForDay ? sessaoAtiva.concluidos : []);
  const doneCount = d => (workoutPlan[d.id] || []).filter(e => activeForDay
    ? sessionCompleted.has(exKey(d, e))
    : done[exKey(d, e)]).length;
  const total = day.ex.length, count = doneCount(day);
  const pct = total ? Math.round((count / total) * 100) : 0;
  const finished = total > 0 && count === total;
  const dayHistory = historico.filter(session => session.diaId === day.id).slice().reverse();

  useEffect(() => {
    if (!sessaoAtiva) return undefined;
    const timer = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(timer);
  }, [sessaoAtiva]);

  const startWorkout = () => {
    setSessaoAtiva({
      diaId: day.id,
      data: todayIso(),
      iniciadoEm: Date.now(),
      concluidos: []
    });
  };

  const finishWorkout = () => {
    if (!activeForDay) return;
    const finalizadoEm = Date.now();
    const completed = new Set(sessaoAtiva.concluidos);
    setHistorico(sessions => [...sessions, {
      diaId: day.id,
      data: sessaoAtiva.data,
      iniciadoEm: sessaoAtiva.iniciadoEm,
      finalizadoEm,
      exercicios: day.ex.map(ex => ({
        nome: ex.name,
        series: ex.sets,
        repeticoes: ex.reps,
        carga: loads[exKey(day, ex)] || '',
        feito: completed.has(exKey(day, ex))
      }))
    }].slice(-2500));
    setSessaoAtiva(null);
  };

  return (
    <>
      <header>
        <h1 className="font-display text-[40px] font-bold leading-none">Treino da semana</h1>
        <p className="mt-1 text-lg text-soft">Toque no dia, marque cada exercício ao terminar.</p>
      </header>

      <nav aria-label="Dias da semana" className="tabs -mx-4 mt-5 overflow-x-auto px-4">
        <ul className="flex gap-2 pb-1">
          {WEEK.map((d, i) => {
            const sel = i === dayIdx, n = (workoutPlan[d.id] || []).length, c = doneCount(d);
            return (
              <li key={d.id}>
                <button type="button" onClick={() => setDayIdx(i)} aria-pressed={sel} aria-label={d.name + (n ? ', ' + c + ' de ' + n + ' feitos' : ', descanso')}
                  className={'flex h-[76px] w-[68px] flex-col items-center justify-center rounded-2xl border-[3px] transition-colors ' + (sel ? 'border-accent bg-accent text-onaccent' : 'border-line bg-card text-ink')}>
                  <span className="font-display text-[26px] font-bold leading-none">{d.short}</span>
                  <span className="mt-1 text-base font-semibold">{n ? (c === n ? 'Feito' : c + '/' + n) : 'Folga'}</span>
                </button>
              </li>
            );
          })}
        </ul>
      </nav>

      <section className="mt-6" aria-live="polite">
        <h2 className="font-display text-[34px] font-bold leading-tight">{day.name}: {day.focus}</h2>

        {total > 0 ? (
          <>
            <section className="mt-4 rounded-2xl border-2 border-line bg-card p-4" aria-live="polite">
              {activeForDay ? (
                <>
                  <p className="text-base font-semibold text-soft">Treino em andamento desde {formatDateTime(sessaoAtiva.iniciadoEm)}</p>
                  <p className="mt-1 font-display text-[38px] font-bold tabular-nums" aria-label="Tempo de treino">
                    {formatDuration(Math.max(0, Math.floor((now - sessaoAtiva.iniciadoEm) / 1000)))}
                  </p>
                  <button type="button" onClick={finishWorkout}
                    className="mt-3 h-14 w-full rounded-xl bg-accent text-lg font-bold text-onaccent">
                    Finalizar treino
                  </button>
                </>
              ) : (
                <>
                  {sessaoAtiva && <p className="mb-3 text-base font-semibold text-soft">Treino de {WEEK.find(item => item.id === sessaoAtiva.diaId)?.name} em andamento.</p>}
                  <button type="button" disabled={!!sessaoAtiva} onClick={startWorkout}
                    className="h-14 w-full rounded-xl bg-accent text-lg font-bold text-onaccent disabled:opacity-60">
                    Começar treino
                  </button>
                </>
              )}
            </section>

            <div className="mt-3" role="progressbar" aria-valuemin="0" aria-valuemax={total} aria-valuenow={count} aria-label="Progresso do treino">
              <div className="flex justify-between text-lg font-semibold">
                <span>{count} de {total} exercícios</span><span>{pct}%</span>
              </div>
              <div className="mt-1 h-4 overflow-hidden rounded-full border-2 border-ink bg-card">
                <div className="h-full bg-ok transition-all" style={{ width: pct + '%' }} />
              </div>
            </div>

            {finished && (
              <p className="mt-4 rounded-2xl bg-ok p-4 text-xl font-bold text-bg">Treino concluído. Bom trabalho! Já aparece como presença no calendário.</p>
            )}

            <ul className="mt-5 space-y-4">
              {day.ex.map(e => {
                const k = exKey(day, e);
                const isDone = activeForDay ? sessionCompleted.has(k) : !!done[k];
                return <Exercise key={k} ex={e} done={isDone} load={loads[k] || ''}
                  onToggle={() => {
                    const nextDone = !isDone;
                    setDone(s => ({ ...s, [k]: nextDone }));
                    setSessaoAtiva(session => {
                      if (!session || session.diaId !== day.id) return session;
                      const completed = new Set(session.concluidos);
                      if (nextDone) completed.add(k);
                      else completed.delete(k);
                      return { ...session, concluidos: Array.from(completed) };
                    });
                  }}
                  onLoad={v => setLoads(s => ({ ...s, [k]: v }))} />;
              })}
            </ul>

            <section className="mt-6 rounded-2xl border-2 border-line bg-card p-4">
              <h3 className="font-display text-[28px] font-bold">Histórico de {day.name}</h3>
              {dayHistory.length ? (
                <ul className="mt-3 space-y-3">
                  {dayHistory.map((session, index) => {
                    const duration = Math.max(0, Math.floor((session.finalizadoEm - session.iniciadoEm) / 1000));
                    const exercisesDone = session.exercicios.filter(ex => ex.feito);
                    return (
                      <li key={session.iniciadoEm + '-' + index} className="rounded-xl border-2 border-line p-3">
                        <p className="font-bold">{formatDateTime(session.iniciadoEm)}</p>
                        <p className="text-soft">Duração: {formatDuration(duration)} · {exercisesDone.length} de {session.exercicios.length} exercícios</p>
                        {session.exercicios.length > 0 && (
                          <ul className="mt-2 space-y-1">
                            {session.exercicios.map((ex, exerciseIndex) => (
                              <li key={exerciseIndex} className="text-base">
                                {ex.feito ? '✓' : '–'} {ex.nome} · {ex.series} × {ex.repeticoes}{ex.carga ? ' · ' + ex.carga + ' kg' : ''}
                              </li>
                            ))}
                          </ul>
                        )}
                      </li>
                    );
                  })}
                </ul>
              ) : (
                <p className="mt-2 text-soft">Nenhum treino finalizado neste dia ainda.</p>
              )}
            </section>

            <div className="fixed inset-x-0 z-10 px-4" style={{ bottom: 'calc(env(safe-area-inset-bottom, 0px) + 76px)' }}>
              <button type="button" disabled={finished}
                onClick={() => {
                  const next = {};
                  const completedKeys = day.ex.map(e => exKey(day, e));
                  day.ex.forEach(e => { next[exKey(day, e)] = true; });
                  setDone(s => ({ ...s, ...next }));
                  setSessaoAtiva(session => session && session.diaId === day.id
                    ? { ...session, concluidos: completedKeys }
                    : session);
                }}
                className="mx-auto block h-16 w-full max-w-2xl rounded-2xl bg-accent text-[22px] font-bold text-onaccent shadow-lg disabled:opacity-60">
                {finished ? 'Todos os exercícios feitos' : 'Concluir todos os exercícios'}
              </button>
            </div>
          </>
        ) : (
          <p className="mt-4 rounded-2xl border-2 border-line bg-card p-5 text-xl">Hoje é dia de descanso. Escolha outro dia acima para ver o treino.</p>
        )}
        <WorkoutEditor day={day} workoutPlan={workoutPlan} setWorkoutPlan={setWorkoutPlan} locked={!!sessaoAtiva} />
      </section>
    </>
  );
}

/* ---------- Página 2: Calendário de presença ---------- */
const ESTILO = {
  fui:       'border-ok bg-ok text-bg',
  faltei:    'border-bad bg-bad text-bg',
  descanso:  'border-transparent bg-transparent text-soft',
  pendente:  'border-line bg-card text-ink',
  nada:      'border-transparent bg-transparent text-soft'
};
const MARCA = { fui: '✓', faltei: '✕', descanso: '', pendente: '', nada: '' };
const TEXTO = { fui: 'Você foi treinar', faltei: 'Você não foi treinar', descanso: 'Dia de descanso', pendente: 'Treino ainda não feito', nada: 'Sem registro' };

function Calendario({ statusOf, presenca, setPresenca }) {
  const hoje = todayIso();
  const t = new Date();
  const [ym, setYm] = useState({ y: t.getFullYear(), m: t.getMonth() });
  const [sel, setSel] = useState(hoje);
  const dias = new Date(ym.y, ym.m + 1, 0).getDate();
  const vazios = idxOf(ym.y, ym.m, 1);
  const mover = n => setYm(({ y, m }) => { const d = new Date(y, m + n, 1); return { y: d.getFullYear(), m: d.getMonth() }; });

  let fui = 0, faltei = 0;
  for (let d = 1; d <= dias; d++) { const s = statusOf(isoOf(ym.y, ym.m, d)); if (s === 'fui') fui++; if (s === 'faltei') faltei++; }
  const taxa = fui + faltei ? Math.round(fui / (fui + faltei) * 100) : 0;

  const [sy, sm, sd] = sel.split('-').map(Number);
  const selStatus = statusOf(sel), selDia = WEEK[idxOf(sy, sm - 1, sd)];
  const manual = presenca[sel] !== undefined;
  const marcar = v => setPresenca(p => ({ ...p, [sel]: v }));
  const limpar = () => setPresenca(p => { const n = { ...p }; delete n[sel]; return n; });

  return (
    <>
      <h1 className="font-display text-[40px] font-bold leading-none">Calendário</h1>
      <p className="mt-1 text-lg text-soft">Veja os dias em que você foi treinar e os dias em que faltou.</p>

      <div className="mt-4 flex items-center justify-between gap-2">
        <button type="button" onClick={() => mover(-1)} aria-label="Mês anterior" className="h-14 w-14 rounded-xl border-[3px] border-ink bg-card text-2xl font-bold">‹</button>
        <h2 className="font-display text-[30px] font-bold leading-none" aria-live="polite">{MESES[ym.m]} {ym.y}</h2>
        <button type="button" onClick={() => mover(1)} aria-label="Próximo mês" className="h-14 w-14 rounded-xl border-[3px] border-ink bg-card text-2xl font-bold">›</button>
      </div>

      <div className="mt-4 grid grid-cols-7 gap-1.5 text-center">
        {SEM.map(s => <span key={s} className="text-sm font-bold text-soft">{s}</span>)}
        {Array.from({ length: vazios }).map((_, i) => <span key={'v' + i} />)}
        {Array.from({ length: dias }).map((_, i) => {
          const d = i + 1, iso = isoOf(ym.y, ym.m, d), s = statusOf(iso);
          return (
            <button key={iso} type="button" onClick={() => setSel(iso)} aria-pressed={iso === sel}
              aria-label={d + ' de ' + MESES[ym.m] + ': ' + TEXTO[s] + (iso === hoje ? ' (hoje)' : '')}
              className={'flex h-14 flex-col items-center justify-center rounded-xl border-[3px] ' + ESTILO[s] + (iso === hoje ? ' !border-accent' : '') + (iso === sel ? ' ring-[3px] ring-ink ring-offset-2 ring-offset-bg' : '')}>
              <span className="text-lg font-bold leading-none">{d}</span>
              <span className="mt-0.5 text-sm font-bold leading-none" aria-hidden="true">{MARCA[s] || '\u00a0'}</span>
            </button>
          );
        })}
      </div>

      <ul className="mt-4 flex flex-wrap gap-x-5 gap-y-1 text-base font-semibold" aria-label="Legenda">
        <li><span className="mr-1 inline-block h-4 w-4 rounded bg-ok align-middle" aria-hidden="true" />✓ Fui</li>
        <li><span className="mr-1 inline-block h-4 w-4 rounded bg-bad align-middle" aria-hidden="true" />✕ Não fui</li>
        <li><span className="mr-1 inline-block h-4 w-4 rounded border-[3px] border-accent align-middle" aria-hidden="true" />Hoje</li>
      </ul>

      <div className="mt-4 grid grid-cols-3 gap-3 text-center">
        <div className="rounded-2xl border-2 border-line bg-card p-3"><p className="font-display text-[34px] font-bold leading-none text-ok">{fui}</p><p className="text-base font-semibold text-soft">treinos feitos</p></div>
        <div className="rounded-2xl border-2 border-line bg-card p-3"><p className="font-display text-[34px] font-bold leading-none text-bad">{faltei}</p><p className="text-base font-semibold text-soft">faltas</p></div>
        <div className="rounded-2xl border-2 border-line bg-card p-3"><p className="font-display text-[34px] font-bold leading-none">{taxa}%</p><p className="text-base font-semibold text-soft">presença</p></div>
      </div>

      <section className="mt-4 rounded-2xl border-2 border-line bg-card p-4" aria-live="polite">
        <p className="text-base font-semibold text-soft">{selDia.name}, {pad(sd)}/{pad(sm)}{sel === hoje ? ' · hoje' : ''}</p>
        <h3 className="font-display text-[28px] font-bold leading-tight">{selDia.focus}</h3>
        <p className={'text-lg font-bold ' + (selStatus === 'fui' ? 'text-ok' : selStatus === 'faltei' ? 'text-bad' : 'text-soft')}>{MARCA[selStatus]} {TEXTO[selStatus]}</p>
        <div className="mt-3 grid grid-cols-2 gap-3">
          <button type="button" onClick={() => marcar(true)} className="h-14 rounded-xl border-[3px] border-ok bg-ok text-lg font-bold text-bg">Fui treinar</button>
          <button type="button" onClick={() => marcar(false)} className="h-14 rounded-xl border-[3px] border-bad bg-bad text-lg font-bold text-bg">Não fui</button>
        </div>
        {manual && <button type="button" onClick={limpar} className="mt-3 h-12 w-full rounded-xl border-[3px] border-line text-base font-bold text-soft">Remover meu registro deste dia</button>}
      </section>
    </>
  );
}

/* ---------- App: navegação entre as páginas ---------- */
const ic = p => <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{p}</svg>;
const TABS = [
  ['hoje', 'Treino', ic(<><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></>)],
  ['calendario', 'Calendário', ic(<><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></>)],
  ['perfil', 'Perfil', ic(<><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></>)]
];

const defaultWorkoutPlan = () => Object.fromEntries(
  WEEK.map(day => [day.id, day.ex.map(exercise => ({ ...exercise }))])
);

const mergeWorkoutPlan = savedPlan => {
  const plan = defaultWorkoutPlan();
  if (!savedPlan || typeof savedPlan !== 'object' || Array.isArray(savedPlan)) return plan;
  WEEK.forEach(day => {
    if (Array.isArray(savedPlan[day.id])) {
      plan[day.id] = savedPlan[day.id];
    }
  });
  return plan;
};

function App() {
  const skipNextSave = useRef(false);
  const saveQueue = useRef(Promise.resolve());
  const userIdRef = useRef(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [dataReady, setDataReady] = useState(false);
  const [authMode, setAuthMode] = useState('login');
  const [authError, setAuthError] = useState('');
  const [authBusy, setAuthBusy] = useState(false);
  const [syncError, setSyncError] = useState('');
  const [view, setView] = useState('hoje');
  const [done, setDone] = useState({});
  const [loads, setLoads] = useState({});
  const [presenca, setPresenca] = useState({});
  const [historico, setHistorico] = useState([]);
  const [sessaoAtiva, setSessaoAtiva] = useState(null);
  const [workoutPlan, setWorkoutPlan] = useState(defaultWorkoutPlan);
  const [rankings, setRankings] = useState(null);
  const [rankingBusy, setRankingBusy] = useState(false);
  const [rankingError, setRankingError] = useState('');
  userIdRef.current = user?.id ?? null;

  useEffect(() => {
    let active = true;
    (async () => {
      try {
        const session = await api('me');
        const saved = await api('workout');
        if (!active) return;
        setUser(session.user);
        setDone(saved.data.done || {});
        setLoads(saved.data.loads || {});
        setPresenca(saved.data.presenca || {});
        setHistorico(saved.data.historico || []);
        setSessaoAtiva(saved.data.sessaoAtiva || null);
        setWorkoutPlan(mergeWorkoutPlan(saved.data.exercisesByDay));
        skipNextSave.current = true;
        setDataReady(true);
      } catch (error) {
        if (active && error.status !== 401) setAuthError(error.message);
      } finally {
        if (active) setAuthReady(true);
      }
    })();
    return () => { active = false; };
  }, []);

  useEffect(() => {
    if (!user || !dataReady) return undefined;
    let active = true;
    setRankingBusy(true);
    api('leaderboard')
      .then(result => {
        if (!active) return;
        setRankings(result.rankings);
        setRankingError('');
      })
      .catch(error => {
        if (active) setRankingError(error.message);
      })
      .finally(() => {
        if (active) setRankingBusy(false);
      });
    return () => { active = false; };
  }, [user, dataReady]);

  useEffect(() => {
    if (!user || !dataReady) return;
    if (skipNextSave.current) {
      skipNextSave.current = false;
      return;
    }

    const userId = user.id;
    const body = JSON.stringify({ done, loads, presenca, historico, sessaoAtiva, exercisesByDay: workoutPlan });
    const timer = setTimeout(() => {
      saveQueue.current = saveQueue.current.catch(() => {}).then(async () => {
        if (userIdRef.current !== userId) return;
        await api('workout', { method: 'PUT', body });
        if (userIdRef.current !== userId) return;
        setSyncError('');
        try {
          const result = await api('leaderboard');
          if (userIdRef.current !== userId) return;
          setRankings(result.rankings);
          setRankingError('');
        } catch (error) {
          if (userIdRef.current === userId) setRankingError(error.message);
        }
      }).catch(error => {
        if (userIdRef.current === userId) setSyncError(error.message);
      });
    }, 500);
    return () => clearTimeout(timer);
  }, [user, dataReady, done, loads, presenca, historico, sessaoAtiva, workoutPlan]);

  const submitAuth = async event => {
    event.preventDefault();
    setAuthError('');
    setAuthBusy(true);
    const form = new FormData(event.currentTarget);
    const payload = {
      nome: form.get('nome'),
      email: form.get('email'),
      senha: form.get('senha')
    };
    try {
      const result = await api(authMode === 'register' ? 'register' : 'login', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      setDataReady(false);
      const saved = await api('workout');
      skipNextSave.current = true;
      setUser(result.user);
      setDone(saved.data.done || {});
      setLoads(saved.data.loads || {});
      setPresenca(saved.data.presenca || {});
      setHistorico(saved.data.historico || []);
      setSessaoAtiva(saved.data.sessaoAtiva || null);
      setWorkoutPlan(mergeWorkoutPlan(saved.data.exercisesByDay));
      setDataReady(true);
      setAuthError('');
    } catch (error) {
      setAuthError(error.message);
    } finally {
      setAuthBusy(false);
    }
  };

  const logout = async () => {
    try {
      await api('logout', { method: 'POST', body: '{}' });
      setUser(null);
      setDataReady(false);
      setDone({});
      setLoads({});
      setPresenca({});
      setHistorico([]);
      setSessaoAtiva(null);
      setWorkoutPlan(defaultWorkoutPlan());
      setRankings(null);
      setRankingError('');
      setSyncError('');
    } catch (error) {
      setAuthError(error.message);
    }
  };

  if (!authReady || (user && !dataReady)) {
    return <main className="mx-auto max-w-2xl px-4 py-10 text-center text-lg font-semibold">Carregando sua conta e seus treinos…</main>;
  }

  if (!user) {
    return (
      <main className="mx-auto max-w-md px-4 py-10">
        <section className="rounded-2xl border-2 border-line bg-card p-6 shadow-sm">
          <h1 className="font-display text-[38px] font-bold leading-tight">Treino da semana</h1>
          <p className="mb-5 text-lg text-soft">{authMode === 'register' ? 'Crie sua conta para salvar e acessar seu treino.' : 'Entre para acessar seus treinos salvos.'}</p>
          <form onSubmit={submitAuth} className="space-y-4">
            {authMode === 'register' && (
              <label className="block">
                <span className="block font-semibold">Nome</span>
                <input name="nome" required minLength="2" maxLength="120" autoComplete="name"
                  className="mt-1 h-14 w-full rounded-xl border-2 border-line bg-card px-3 text-lg" />
              </label>
            )}
            <label className="block">
              <span className="block font-semibold">E-mail</span>
              <input name="email" type="email" inputMode="email" required maxLength="190"
                autoComplete={authMode === 'register' ? 'email' : 'username'}
                autoCapitalize="none" spellCheck={false}
                placeholder="voce@exemplo.com"
                className="mt-1 h-14 w-full rounded-xl border-2 border-line bg-card px-3 text-lg" />
            </label>
            <label className="block">
              <span className="block font-semibold">Senha</span>
              <input name="senha" type="password" required minLength="8" maxLength="72"
                autoComplete={authMode === 'register' ? 'new-password' : 'current-password'}
                className="mt-1 h-14 w-full rounded-xl border-2 border-line bg-card px-3 text-lg" />
              {authMode === 'register' && <span className="mt-1 block text-sm text-soft">Use pelo menos 8 caracteres.</span>}
            </label>
            {authError && <p role="alert" className="rounded-xl bg-red-100 p-3 font-semibold text-red-800">{authError}</p>}
            <button type="submit" disabled={authBusy}
              className="h-14 w-full rounded-xl bg-accent text-lg font-bold text-onaccent disabled:opacity-60">
              {authBusy ? 'Aguarde…' : authMode === 'register' ? 'Criar cadastro' : 'Entrar'}
            </button>
          </form>
          <button type="button" onClick={() => { setAuthMode(authMode === 'register' ? 'login' : 'register'); setAuthError(''); }}
            className="mt-4 w-full py-2 font-semibold text-accent">
            {authMode === 'register' ? 'Já tenho cadastro · Fazer login' : 'Ainda não tenho cadastro · Criar conta'}
          </button>
        </section>
      </main>
    );
  }

  const hoje = todayIso();
  const t = new Date(); t.setDate(t.getDate() - todayIndex());
  const semanaAtual = Array.from({ length: 7 }, (_, i) => isoOf(t.getFullYear(), t.getMonth(), t.getDate() + i));

  // Resultado de cada data: fui, faltei, descanso, pendente ou nada
  const statusOf = iso => {
    if (presenca[iso] !== undefined) return presenca[iso] ? 'fui' : 'faltei';
    const [y, m, d] = iso.split('-').map(Number), wd = idxOf(y, m - 1, d), dia = WEEK[wd], wi = semanaAtual.indexOf(iso);
    const exercises = workoutPlan[dia.id] || [];
    if (wi >= 0 && exercises.length && exercises.every(e => done[exKey(dia, e)])) return 'fui';
    if (!exercises.length) return 'descanso';
    return iso < hoje ? 'nada' : 'pendente';
  };

  return (
    <>
      <main className="mx-auto max-w-2xl px-4 pb-52 pt-5">
        <div className="mb-5 flex items-center justify-between gap-3 rounded-xl border-2 border-line bg-card px-4 py-3">
          <div className="min-w-0">
            <p className="truncate font-semibold">Olá, {user.nome}</p>
            <p role="status" className="text-sm text-soft">{syncError || 'Treinos sincronizados com sua conta'}</p>
          </div>
          <button type="button" onClick={logout} className="shrink-0 rounded-lg border-2 border-line px-3 py-2 text-base font-bold">Sair</button>
        </div>
        {view === 'hoje'
          ? <Hoje done={done} setDone={setDone} loads={loads} setLoads={setLoads}
              historico={historico} setHistorico={setHistorico} sessaoAtiva={sessaoAtiva} setSessaoAtiva={setSessaoAtiva}
              workoutPlan={workoutPlan} setWorkoutPlan={setWorkoutPlan} />
          : view === 'calendario'
            ? <Calendario statusOf={statusOf} presenca={presenca} setPresenca={setPresenca} />
            : <Perfil user={user} workoutPlan={workoutPlan} historico={historico}
                rankings={rankings} rankingBusy={rankingBusy} rankingError={rankingError} />}
      </main>
      <nav aria-label="Principal" className="fixed inset-x-0 bottom-0 z-20 border-t-2 border-line bg-card" style={{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
        <ul className="mx-auto flex max-w-2xl">
          {TABS.map(tb => (
            <li key={tb[0]} className="flex-1">
              <button type="button" onClick={() => { setView(tb[0]); window.scrollTo(0, 0); }} aria-current={view === tb[0] ? 'page' : undefined}
                className={'flex h-16 w-full flex-col items-center justify-center gap-0.5 text-base font-bold ' + (view === tb[0] ? 'text-accent' : 'text-soft')}>
                {tb[2]}<span>{tb[1]}</span>
              </button>
            </li>
          ))}
        </ul>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
